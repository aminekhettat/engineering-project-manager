image: python:3.12-bookworm

stages:
  - validate

validate:
  stage: validate
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUTF8: "1"
  script:
    - git --version
    - python3 -B tools/run_checks.py
    - python3 -B tools/publication_check.py . --profile repository

# Portable public layout; configure private runner tags in your own repository.
