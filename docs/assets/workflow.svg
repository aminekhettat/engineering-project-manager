<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">From project intent to a checked release</title>
<desc id="desc">Discover, configure, delegate, verify, then check the release gate. In an executed synthetic demo, tests move from one of three passing to three of three passing, and the complete gate moves from blocked to pass.</desc>
<rect width="1200" height="390" rx="22" fill="#101d32"/>
<text x="46" y="57" fill="#9de4d2" font-family="Arial, sans-serif" font-size="14" font-weight="700">PROJECT MANAGER · OPENCLAW</text>
<text x="46" y="101" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Make the evidence part of the workflow.</text>
<g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
<rect x="46" y="135" width="190" height="66" rx="10" fill="#23364f"/><text x="141" y="175" fill="#ffffff">Discover</text>
<path d="M247 168h25m-7-7 7 7-7 7" fill="none" stroke="#9de4d2" stroke-width="2"/>
<rect x="282" y="135" width="190" height="66" rx="10" fill="#23364f"/><text x="377" y="175" fill="#ffffff">Configure</text>
<path d="M483 168h25m-7-7 7 7-7 7" fill="none" stroke="#9de4d2" stroke-width="2"/>
<rect x="518" y="135" width="190" height="66" rx="10" fill="#23364f"/><text x="613" y="175" fill="#ffffff">Delegate</text>
<path d="M719 168h25m-7-7 7 7-7 7" fill="none" stroke="#9de4d2" stroke-width="2"/>
<rect x="754" y="135" width="166" height="66" rx="10" fill="#23364f"/><text x="837" y="175" fill="#ffffff">Verify</text>
<path d="M931 168h25m-7-7 7 7-7 7" fill="none" stroke="#9de4d2" stroke-width="2"/>
<rect x="966" y="135" width="188" height="66" rx="10" fill="#9de4d2"/><text x="1060" y="175" fill="#101d32">Release gate</text>
</g>
<path d="M46 229h1108" stroke="#3b4c64"/>
<g font-family="Arial, sans-serif">
<text x="46" y="264" fill="#aabbce" font-size="14">EXECUTED OFFLINE DEMO</text>
<text x="46" y="306" fill="#ffffff" font-size="25" font-weight="700">1/3 checks → 3/3 checks</text>
<text x="552" y="306" fill="#9de4d2" font-size="25" font-weight="700">BLOCKED → PASS</text>
<text x="46" y="355" fill="#aabbce" font-size="14">Synthetic project · Real CLI execution · SPICE-like, not certified · No deployment</text>
</g></svg>
